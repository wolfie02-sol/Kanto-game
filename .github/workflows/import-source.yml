name: Import prepared game source

# One-time bridge for the text-only repository connector and bundled binary assets.
# Safe to remove after the import succeeds. Normal checks live in ci.yml.
on:
  push:
    paths:
      - '.bootstrap/source.tar.gz.b64'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and unpack approved source
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, tarfile
          payload = pathlib.Path('.bootstrap/source.tar.gz.b64')
          if not payload.exists():
              print('Source already imported; nothing to do.')
              raise SystemExit(0)
          archive = base64.b64decode(payload.read_bytes(), validate=True)
          expected = '8e8af05a55a8afc0154aec92194d84be26acdd9166c84beae485e28bfdaf8cde'
          if hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit('Source archive checksum mismatch')
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as source:
              for member in source.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or any(p in {'.git', '.github', '.openai', '.data', 'node_modules'} for p in path.parts) or member.issym() or member.islnk():
                      raise SystemExit('Unexpected archive entry')
              source.extractall('.', filter='data')
          payload.unlink()
          PY
      - name: Verify game and rewards
        run: |
          npm test
          npm run build
      - name: Commit readable source and bundled assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import documented game with server-authoritative sandbox rewards'
          git push origin HEAD:main
